name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64
          - universal

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer & main
        run: |
          npm run build:main
          npm run build:renderer

      - name: Build DMG (${{ inputs.arch }})
        run: |
          ARGS="--mac dmg"
          if [ "${{ inputs.arch }}" = "x86_64" ]; then
            ARGS="$ARGS --x64"
          elif [ "${{ inputs.arch }}" = "arm64" ]; then
            ARGS="$ARGS --arm64"
          else
            ARGS="$ARGS --universal"
          fi
          node node_modules/electron-builder/out/cli/cli.js $ARGS --publish never

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Win-Box-macOS-dmg
          path: release*/**/*.dmg
          if-no-files-found: error
